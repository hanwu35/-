<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智检AI - 智能体检平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<!-- 登录模态框 -->
<div class="login-modal" id="loginModal">
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <i class="fas fa-heartbeat"></i>
                <span>智检AI</span>
            </div>
            <p>智能体检，预见健康</p>
        </div>

        <div class="login-tabs">
            <button class="tab-btn active" data-tab="user">用户登录</button>
            <button class="tab-btn" data-tab="doctor">医生登录</button>
        </div>

        <!-- 用户登录表单 -->
        <form class="login-form active" id="userForm">
            <div class="form-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="手机号/用户名" required>
            </div>
            <div class="form-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="密码" required>
            </div>
            <div class="form-options">
                <label class="checkbox">
                    <input type="checkbox" checked>
                    <span>记住我</span>
                </label>
                <a href="#" class="forgot-link">忘记密码？</a>
            </div>
            <button type="submit" class="submit-btn user-btn">
                <i class="fas fa-sign-in-alt"></i>
                用户登录
            </button>
        </form>

        <!-- 医生登录表单 -->
        <form class="login-form" id="doctorForm">
            <div class="form-group">
                <i class="fas fa-user-md"></i>
                <input type="text" id="doctorId" placeholder="医生工号" required>
            </div>
            <div class="form-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="doctorPassword" placeholder="密码" required>
            </div>
            <button type="submit" class="submit-btn doctor-btn">
                <i class="fas fa-stethoscope"></i>
                医生登录
            </button>
        </form>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
