logging.level.org.springframework.transaction.interceptor=${LOG_TRANSACTION_INTERCEPTOR:TRACE}
logging.level.org.springframework.orm.jpa=${LOG_SPRING_ORM_JPA:DEBUG}
logging.level.org.springframework.jdbc=${LOG_SPRING_JDBC:DEBUG}


logging.file.name=${LOG_FILE:logs/application.log}
logging.file.max-size=${LOG_FILE_MAX_SIZE:10MB}
logging.file.max-history=${LOG_FILE_MAX_HISTORY:10}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

#
logging.charset.console=UTF-8
logging.charset.file=UTF-8


server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Spring HTTP
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true