spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.use_sql_comments=${HIBERNATE_USE_SQL_COMMENTS:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_HIBERNATE_BINDER:TRACE}
logging.level.org.hibernate.type.descriptor.sql=${LOG_HIBERNATE_TYPE_SQL:TRACE}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_HIBERNATE_JDBC_BIND:TRACE}


logging.level.org.springframework.data.jpa=${LOG_SPRING_DATA_JPA:DEBUG}
logging.level.org.springframework.transaction=${LOG_SPRING_TRANSACTION:TRACE}


logging.level.com.example.aihealthcheck=${LOG_APP_ROOT:DEBUG}
logging.level.com.example.aihealthcheck.service=${LOG_APP_SERVICE:DEBUG}
logging.level.com.example.aihealthcheck.repository=${LOG_APP_REPOSITORY:DEBUG}
logging.level.com.example.aihealthcheck.controller=${LOG_APP_CONTROLLER:DEBUG}
logging.level.com.example.aihealthcheck.entity=${LOG_APP_ENTITY:DEBUG}


logging.level.com.example.aihealthcheck.service.prediction=${LOG_PREDICTION_SERVICE:TRACE}
